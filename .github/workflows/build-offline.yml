name: Build offline Happybox candidate
'on':
  push:
    branches:
    - release/happybox-offline
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      RT_APK_PATH: app/build/outputs/apk/release/app-release.apk
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Validate stable signing configuration
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: python3 scripts/prepare_ci_signing.py
    - name: Require existing fixed certificate
      run: 'test "$RT_STABLE_SIGNING" = true

        python3 scripts/check_offline_signing.py'
    - name: Validate offline runtime and local data preservation
      run: 'python3 -m pip install playwright

        python3 -m playwright install --with-deps chromium

        python3 scripts/check_offline.py

        node scripts/check_party_core.cjs

        node scripts/check_game_library.cjs

        python3 scripts/check_apk_updates.py'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Configure Android SDK
      shell: bash
      run: 'SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

        test -n "$SDK_DIR" || exit 1

        SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head
        -n 1)

        test -n "$SDKMANAGER" || exit 1

        echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

        '
    - name: Accept Android SDK licenses
      run: yes | "$SDKMANAGER" --licenses || true
    - name: Install Android SDK packages
      run: '"$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

        '
    - name: Build signed release candidate APK
      if: env.RT_STABLE_SIGNING == 'true'
      run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
    - name: Upload native update test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Happybox-native-update-tests
        path: app/build/test-results/testDebugUnitTest/*.xml
        if-no-files-found: ignore
    - name: Verify APK identity, fixed certificate and prior APK compatibility
      if: env.RT_STABLE_SIGNING == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        RT_PREVIOUS_APK_RELEASE_TAG: ui-v2.7-code100142
        RT_PREVIOUS_APK_ARTIFACT_ID: '13222716729'
      run: python3 scripts/verify_signed_apk.py
    - name: Inspect offline APK assets
      run: python3 scripts/check_offline_apk.py
    - name: Upload APK
      if: env.RT_STABLE_SIGNING == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Happybox-offline-candidate-apk
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
    - name: Upload public APK verification report
      if: env.RT_STABLE_SIGNING == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Happybox-APK-verification
        path: 'release-output/verification.json

          release-output/SHA256SUMS

          release-output/release-info.json

          '
        if-no-files-found: error
