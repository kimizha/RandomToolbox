name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_DIR" || exit 1
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER" || exit 1
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install CloudBase SDK build tools
        run: |
          npm install --no-save --no-package-lock \
            @cloudbase/js-sdk@3 \
            esbuild@0.25

      - name: Bundle CloudBase SDK locally
        run: |
          mkdir -p scripts
          mkdir -p app/src/main/assets

          cat > scripts/cloudbase-entry.js <<'EOF'
          import cloudbase from '@cloudbase/js-sdk';
          window.RTCloudbaseSDK = cloudbase;
          EOF

          npx esbuild scripts/cloudbase-entry.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=es2020 \
            --outfile=app/src/main/assets/cloudbase-sdk.js

      - name: Add account system to bundled HTML
        env:
          CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
        run: python3 scripts/inject_auth.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RandomToolbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
