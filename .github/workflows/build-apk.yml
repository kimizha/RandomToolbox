name: Build Android APK
# Manual rebuild requested 2026-10-30: verify JavaScript syntax fix and emulator startup.

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish the verified UI APK as a GitHub prerelease'
        type: boolean
        default: false
  push:
    branches: [main, dev/cloudbase-auth-integration, ui/android-happybox-redesign]
    paths-ignore:
      - 'build-status/latest-dev-run.json'

jobs:
  publish-run-pointer:
    name: Record latest development build run
    concurrency:
      group: randomtoolbox-dev-run-pointer
      cancel-in-progress: false
    if: github.ref == 'refs/heads/dev/cloudbase-auth-integration'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/cloudbase-auth-integration
          persist-credentials: true
      - name: Save latest run information
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p build-status
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'run_url': f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              'source_commit': os.environ['HEAD_SHA'],
              'branch': 'dev/cloudbase-auth-integration',
          }
          Path('build-status/latest-dev-run.json').write_text(
              json.dumps(record, indent=2, ensure_ascii=False) + chr(10), encoding='utf-8'
          )
          PY
      - name: Push run pointer without triggering a new build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/latest-dev-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record latest dev Actions run [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin dev/cloudbase-auth-integration
            if git push origin HEAD:dev/cloudbase-auth-integration; then exit 0; fi
            sleep 2
          done
          exit 1

  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate stable signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_ci_signing.py
      - name: Check account synchronization recovery
        run: |
          node --check scripts/sync.js
          node --check scripts/profile.js
          node --check app/src/main/assets/ui/happybox.js
          node --check app/src/main/assets/ui/soup-game.js
          node --check app/src/main/assets/ui/party-games.js
          node --check app/src/main/assets/ui/party-score.js
          node scripts/check_party_core.cjs
          node scripts/check_game_library.cjs
          node scripts/check_sync.cjs
          python3 scripts/check_release.py
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_DIR" || exit 1
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER" || exit 1
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses || true
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install CloudBase SDK build tools
        run: |
          npm install --no-save --no-package-lock \
            @cloudbase/js-sdk@3 \
            esbuild@0.25
      - name: Bundle CloudBase SDK locally
        run: |
          mkdir -p scripts app/src/main/assets
          cat > scripts/cloudbase-entry.js <<'JS'
          import cloudbase from '@cloudbase/js-sdk';
          window.RTCloudbaseSDK = cloudbase;
          JS
          npx esbuild scripts/cloudbase-entry.js \
            --bundle --format=iife --platform=browser --target=es2020 \
            --outfile=app/src/main/assets/cloudbase-sdk.js
      - name: Add account system to bundled HTML
        env:
          CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
        run: python3 scripts/inject_auth.py
      - name: Verify bundled HTML JavaScript syntax
        run: |
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('app/src/main/assets/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw Error('No inline JavaScript found');
          for (let i = 0; i < scripts.length; i++) {
            new vm.Script(scripts[i][1], {filename: 'inline-script-' + (i + 1) + '.js'});
          }
          console.log('Validated ' + scripts.length + ' inline scripts');
          JS
      - name: Generate CloudBase diagnostic page
        env:
          CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          key=os.environ.get('CLOUDBASE_PUBLISHABLE_KEY','').strip()
          if not key.startswith('eyJ'):
              raise SystemExit('Missing or unexpected client Publishable Key')
          html='''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudBase 认证诊断</title><style>body{font-family:system-ui;background:#f6f7fb;padding:24px}main{max-width:650px;margin:auto;background:white;padding:24px;border-radius:18px}button{padding:12px;border:0;border-radius:10px;background:#8059e4;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:14px;border-radius:10px}</style></head><body><main><h2>CloudBase 认证诊断</h2><p>不发送验证码，不需要账号密码。请不要分享含密钥的源文件。</p><button id="go">检测认证服务</button><pre id="out">等待检测</pre></main><script type="module">
          const KEY=__KEY__;
          const out=document.getElementById('out');
          const log=s=>out.textContent+='\\n'+s;
          document.getElementById('go').onclick=async()=>{
            out.textContent='开始检测';
            try{
              const mod=await import('https://esm.sh/@cloudbase/js-sdk@3?bundle');
              const sdk=mod.default||mod;
              log('SDK: 已加载');
              const app=sdk.init({env:'randomtoolbox-d5gg1p6rg1d2287eb',region:'ap-shanghai',accessKey:KEY});
              log('初始化: 已完成');
              const auth=typeof app.auth==='function'?app.auth():app.auth;
              log('认证对象: '+(auth?'已创建':'缺失'));
              if(!auth)throw Error('认证对象不存在');
              const result=await Promise.race([auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(Error('超过15秒')),15000))]);
              if(result?.error)throw result.error;
              log('getSession: 成功返回（没有登录会话也可能正常）');
            }catch(e){log('错误类型: '+(e?.name||'unknown'));log('错误代码: '+(e?.code||'none'));log('错误信息: '+(e?.message||String(e)));}
          };
          </script></body></html>'''
          Path('cloudbase-auth-diagnostic.html').write_text(html.replace('__KEY__',json.dumps(key)),encoding='utf-8')
          print('Diagnostic page generated (client key omitted from logs)')
          PY
      - name: Upload CloudBase diagnostic page
        uses: actions/upload-artifact@v4
        with:
          name: CloudBase-auth-diagnostic
          path: cloudbase-auth-diagnostic.html
          if-no-files-found: error
          retention-days: 1
      - name: Compile checks when the stable key is not configured
        if: env.RT_STABLE_SIGNING != 'true'
        run: gradle :app:compileDebugJavaWithJavac :app:mergeDebugAssets :app:processDebugResources --no-daemon
      - name: Build debug APK
        if: env.RT_STABLE_SIGNING == 'true'
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK identity, fixed certificate and prior APK compatibility
        if: env.RT_STABLE_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RT_PREVIOUS_APK_RELEASE_TAG: 'ui-v2.7-code100142'
          RT_PREVIOUS_APK_ARTIFACT_ID: '13027661359'
        run: python3 scripts/verify_signed_apk.py
      - name: Upload APK
        if: env.RT_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RandomToolbox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish verified UI prerelease
        if: github.ref == 'refs/heads/ui/android-happybox-redesign' && env.RT_STABLE_SIGNING == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_preview == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_ui_release.py
      - name: Upload public APK verification report
        if: env.RT_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Happybox-APK-verification
          path: |
            release-output/verification.json
            release-output/SHA256SUMS
            release-output/release-info.json
          if-no-files-found: error

      - name: Publish successful development APK as prerelease
        if: github.ref == 'refs/heads/dev/cloudbase-auth-integration' && env.RT_STABLE_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\).*/\1/p' app/build.gradle | head -1)
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          TAG="dev-v${VERSION_NAME}-code${VERSION_CODE}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release-output
          cp "$APK" "release-output/RandomToolbox-v${VERSION_NAME}-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release-output/RandomToolbox-v${VERSION_NAME}-debug.apk" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA"
            echo "Updated existing release $TAG with APK built from $GITHUB_SHA"
          else
            gh release create "$TAG" "release-output/RandomToolbox-v${VERSION_NAME}-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "随机工具箱 V${VERSION_NAME}（开发测试版）" \
              --notes "开发分支自动构建成功后发布。仅供测试，正式版尚未发布。" \
              --prerelease
          fi
