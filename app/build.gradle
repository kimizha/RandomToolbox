plugins {
    id 'com.android.application'
}

def stableSigningValues = ['ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].collect { System.getenv(it) }
def stableSigningEnabled = stableSigningValues.every { it }
if (stableSigningValues.any { it } && !stableSigningEnabled) {
    throw new GradleException('Incomplete stable Android signing configuration')
}

android {
    namespace 'com.randomtoolbox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.randomtoolbox.app'
        minSdk 26
        targetSdk 28
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '16')
        versionName '2.9'
    }

    signingConfigs {
        if (stableSigningEnabled) {
            stable {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (stableSigningEnabled) signingConfig signingConfigs.stable
        }
        release {
            if (stableSigningEnabled) signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Test-only Android view/lifecycle verification; no new APK runtime dependency.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Probe code is injected only by explicit test opt-in. Never package it in release variants.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') } &&
        file('src/main/assets/index.html').getText('UTF-8').contains('HAPPYBOX_SECURITY_PROBE_TEST_ONLY')) {
        throw new GradleException('Security probe test assets cannot be packaged in release builds; use a clean source checkout')
    }
}
