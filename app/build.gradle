plugins {
    id 'com.android.application'
}

android {
    namespace 'com.randomtoolbox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.randomtoolbox.app'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
