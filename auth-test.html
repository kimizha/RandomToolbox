
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f7fb">
<title>随机工具箱 · CloudBase 账号测试</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f6f7fb;
  color: #242039;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
}

main {
  max-width: 520px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 22px;
  box-shadow: 0 8px 35px rgba(0,0,0,.05);
}

h2 { margin-top: 0; }

.subtitle {
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
  line-height: 1.7;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 600;
}

input {
  display: block;
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
}

input:focus { border-color: #8059e4; }

button {
  display: block;
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  background: #8059e4;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button.secondary {
  background: #f0ebff;
  color: #7045cf;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

hr {
  border: 0;
  border-top: 1px solid #eee;
  margin: 24px 0;
}

pre {
  background: #f4f4f8;
  padding: 15px;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.8;
  font-size: 12px;
  min-height: 100px;
}

.tip {
  font-size: 12px;
  color: #888;
  line-height: 1.8;
  margin-top: 20px;
}

.status {
  font-size: 13px;
  line-height: 1.7;
  color: #7045cf;
  margin-top: 12px;
}
</style>
</head>

<body>
<main>
  <h2>🔐 CloudBase 账号测试</h2>

  <p class="subtitle">
    随机工具箱 · 邮箱注册、验证码验证与登录诊断
  </p>

  <label for="publishableKey">客户端 Publishable Key</label>
  <input
    id="publishableKey"
    type="password"
    placeholder="输入 CloudBase Publishable Key"
    autocomplete="off"
  >

  <label for="email">测试邮箱</label>
  <input
    id="email"
    type="email"
    placeholder="输入收到验证码的邮箱"
    autocomplete="email"
  >

  <label for="password">测试密码</label>
  <input
    id="password"
    type="password"
    placeholder="输入注册时使用的密码"
    autocomplete="new-password"
  >

  <button class="secondary" id="connectionBtn"
    onclick="testConnection()">
    ① 检测 CloudBase SDK
  </button>

  <button id="signupBtn" onclick="testSignup()">
    ② 注册并发送邮箱验证码
  </button>

  <hr>

  <h3>③ 验证邮箱</h3>

  <label for="otp">邮箱验证码</label>
  <input
    id="otp"
    type="text"
    placeholder="输入邮箱收到的验证码"
    autocomplete="one-time-code"
    inputmode="numeric"
  >

  <button id="verifyBtn" class="secondary"
    onclick="verifyEmail()" disabled>
    验证验证码并完成注册
  </button>

  <hr>

  <h3>④ 测试登录</h3>

  <button id="loginBtn" onclick="testLogin()">
    使用邮箱和密码登录
  </button>

  <p class="status" id="status">
    请先检测 SDK，或使用注册按钮开始。
  </p>

  <h3>检测结果</h3>
  <pre id="result">等待检测...</pre>

  <p class="tip">
    本页面仅用于临时诊断。请使用专门的测试账号和密码。
    Publishable Key 是客户端密钥，不要将其与服务端密钥混淆。
    不要把密码、验证码或完整密钥发送给他人。
    登录成功后请勿在公共设备上保留登录状态。
  </p>
</main>

<script>
"use strict";

const ENV_ID = "randomtoolbox-d5gg1p6rg1d2287eb";
const REGION = "ap-shanghai";

let sdk = null;
let authInstance = null;
let pendingSignup = null;
let busy = false;

const $ = id => document.getElementById(id);

function log(message) {
  $("result").textContent += "\n" + message;
}

function reset() {
  $("result").textContent = "开始检测...\n";
}

function setStatus(message) {
  $("status").textContent = message;
}

function setBusy(value) {
  busy = value;

  [
    "connectionBtn",
    "signupBtn",
    "verifyBtn",
    "loginBtn"
  ].forEach(id => {
    $(id).disabled = value ||
      (id === "verifyBtn" && !pendingSignup);
  });
}

function showError(error) {
  log("❌ 操作失败");
  log("错误类型: " + (error?.name || "未知"));
  log("错误代码: " + (error?.code || "无"));
  log("错误信息: " + (error?.message || String(error)));

  if (error?.status) {
    log("HTTP 状态: " + error.status);
  }

  if (error?.statusCode) {
    log("状态代码: " + error.statusCode);
  }

  setStatus("操作失败，请查看上方错误信息。");
}

async function loadSDK() {
  if (sdk) return sdk;

  log("正在加载 CloudBase SDK...");

  const mod = await import(
    "https://esm.sh/@cloudbase/js-sdk@3?bundle"
  );

  sdk = mod.default || mod;

  if (typeof sdk.init !== "function") {
    throw new Error("SDK init 方法不存在");
  }

  log("SDK: 已加载");
  return sdk;
}

function getKey() {
  const key = $("publishableKey").value.trim();

  if (!key) {
    throw new Error("请先填写客户端 Publishable Key");
  }

  return key;
}

async function createAuth() {
  if (authInstance) return authInstance;

  const cloudbase = await loadSDK();

  const app = cloudbase.init({
    env: ENV_ID,
    region: REGION,
    accessKey: getKey()
  });

  log("初始化: 已完成");

  const auth = typeof app.auth === "function"
    ? app.auth()
    : app.auth;

  if (!auth) {
    throw new Error("认证对象创建失败");
  }

  log("认证对象: 已创建");
  log("signUp 方法: " + typeof auth.signUp);

  authInstance = auth;
  return auth;
}

async function testConnection() {
  if (busy) return;

  setBusy(true);
  reset();

  try {
    const auth = await createAuth();

    if (typeof auth.signUp !== "function") {
      throw new Error("signUp 注册方法不存在");
    }

    log("✅ SDK 和注册方法检查通过");
    log("注意：本次没有发送注册请求。");
    setStatus("SDK 初始化成功。");

  } catch (error) {
    showError(error);
  } finally {
    setBusy(false);
  }
}

async function testSignup() {
  if (busy) return;

  setBusy(true);
  reset();

  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !email.includes("@")) {
      throw new Error("请输入正确的测试邮箱");
    }

    if (password.length < 8) {
      throw new Error("测试密码至少需要 8 位");
    }

    const auth = await createAuth();

    if (typeof auth.signUp !== "function") {
      throw new Error("signUp 方法不存在");
    }

    // 新注册请求开始时，清除之前保存的待验证流程。
    pendingSignup = null;
    $("verifyBtn").disabled = true;

    log("正在调用 signUp...");
    log("正在发送邮箱注册请求...");

    const response = await Promise.race([
      auth.signUp({
        email: email,
        password: password
      }),
      new Promise((_, reject) => {
        setTimeout(() => {
          reject(new Error(
            "请求超过 20 秒，网络可能不可达"
          ));
        }, 20000);
      })
    ]);

    if (response?.error) {
      throw response.error;
    }

    log("✅ signUp 请求成功返回");

    const data = response?.data;

    if (data && typeof data.verifyOtp === "function") {
      pendingSignup = data;
      $("verifyBtn").disabled = false;

      log("验证码验证方法已返回");
      log("请检查邮箱并输入验证码。");

      setStatus("已发起注册，请输入邮箱验证码。");
    } else {
      log("响应中没有找到 data.verifyOtp 方法。");
      log("请检查 SDK 返回结构，暂时无法完成验证码验证。");

      setStatus("注册请求已返回，但验证流程未能确认。");
    }

  } catch (error) {
    showError(error);
  } finally {
    setBusy(false);
  }
}

async function verifyEmail() {
  if (busy) return;

  if (!pendingSignup) {
    setStatus("请先发起注册请求，获取验证码验证流程。");
    return;
  }

  setBusy(true);
  reset();

  try {
    const token = $("otp").value.trim();

    if (!token) {
      throw new Error("请输入邮箱收到的验证码");
    }

    log("正在提交邮箱验证码...");

    const result = await pendingSignup.verifyOtp({
      token: token
    });

    if (result?.error) {
      throw result.error;
    }

    log("✅ 验证请求成功返回");
    log("请根据返回结果确认邮箱验证是否完成。");

    if (result?.data) {
      log("验证接口已返回 data。");
    }

    pendingSignup = null;
    $("verifyBtn").disabled = true;

    setStatus(
      "验证码验证请求已成功返回。接下来可以测试登录。"
    );

  } catch (error) {
    showError(error);
  } finally {
    setBusy(false);
  }
}

async function testLogin() {
  if (busy) return;

  setBusy(true);
  reset();

  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !email.includes("@")) {
      throw new Error("请输入注册时使用的邮箱");
    }

    if (!password) {
      throw new Error("请输入注册时使用的密码");
    }

    const auth = await createAuth();

    if (typeof auth.signInWithPassword !== "function") {
      throw new Error(
        "当前 SDK 没有 signInWithPassword 方法，" +
        "请核对当前版本的登录 API。"
      );
    }

    log("正在调用邮箱密码登录...");

    const response = await auth.signInWithPassword({
      email: email,
      password: password
    });

    if (response?.error) {
      throw response.error;
    }

    log("✅ 登录请求成功返回");
    log("登录接口没有返回 error。");

    setStatus("登录请求成功。请确认账号已完成邮箱验证。");

  } catch (error) {
    showError(error);
  } finally {
    setBusy(false);
  }
}
</script>
</body>
</html>
